[tox]
envlist = py,docs,ruff,ruff-format

[testenv]
deps =
    pytest
    pytest-cov
commands =
    python -m pytest --basetemp={envtmpdir} --cov=mopidy_podcast --cov-branch --cov-report term-missing {posargs}

[testenv:docs]
deps =
     sphinx
commands =
     python -m sphinx -W -b html -d {envtmpdir}/doctrees docs {envtmpdir}/html

[testenv:pyright]
deps =
    pyright
    pytest
commands =
    pyright {posargs}

[testenv:ruff]
deps =
    ruff
commands =
    ruff check {posargs}

[testenv:ruff-format]
deps =
    ruff
commands =
    ruff format --diff -q {posargs}
